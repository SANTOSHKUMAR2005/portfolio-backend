spring.datasource.url=${db_url}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ==========================================
# HikariCP Performance Tuning for Aiven & Render
# ==========================================
# Force baseline to 2 connections, capping at 5 to save Aiven resource limits
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

# Reduce idle timeout from 10 minutes to 30 seconds.
# This forces Hikari to kill the 3 extra phone connections almost immediately after use.
spring.datasource.hikari.idle-timeout=120000

# Close and refresh connections every 15 minutes to clear potential ghost connections
spring.datasource.hikari.max-lifetime=900000

# Wait up to 15 seconds for a database connection before throwing a timeout error
spring.datasource.hikari.connection-timeout=15000

# Keep-alive query to ensure the cloud database network socket doesn't drop abruptly
spring.datasource.hikari.keepalive-time=30000


cloudinary.cloud-name=${cloudinary_cloud_name}
cloudinary.api-key=${cloudinary_api_key}
cloudinary.api-secret=${cloudinary_api_secret}

Json_secure_key=${supper_key}

